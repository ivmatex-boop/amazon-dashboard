<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Devoluciones — Comfort Sleep</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2c;
    --panel-border: #2a3244;
    --text: #e7ebf3;
    --text-dim: #9aa4b8;
    --red: #ef4444;
    --red-bg: #3a1516;
    --orange: #f59e0b;
    --orange-bg: #3a2712;
    --yellow: #eab308;
    --yellow-bg: #35300f;
    --gray: #6b7280;
    --gray-bg: #23262d;
    --green: #22c55e;
    --green-bg: #123a1f;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

  .kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 20px;
    min-width: 150px;
  }
  .kpi .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .kpi.risk .value { color: var(--red); }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    min-width: 260px;
  }
  .search-box::placeholder { color: var(--text-dim); }

  .toolbar select {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
  }

  .filter-groups { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

  .export-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .export-btn:hover { border-color: var(--accent); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: white; }

  .result-count { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    padding: 10px 12px;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
  }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--text); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: .6; }
  tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.orange { background: var(--orange-bg); color: var(--orange); }
  .badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .badge.gray { background: var(--gray-bg); color: var(--gray); }
  .badge.none { background: var(--green-bg); color: var(--green); }

  .pill { font-size: 11px; padding: 1px 7px; border-radius: 6px; }
  .pill.yes { background: var(--green-bg); color: var(--green); }
  .pill.no { background: var(--gray-bg); color: var(--text-dim); }

  .case-tag { font-size: 11px; color: var(--text-dim); }
  .case-tag.resolved { color: var(--green); }
  .case-tag.resolved.perdida { color: var(--red); }
  .case-tag.dismissed { color: var(--gray); }
  .case-tag.claim_filed { color: var(--accent); }

  .amount { font-weight: 700; }
  .reason { color: var(--text-dim); font-size: 12px; margin-top: 2px; max-width: 260px; }
  .order-id { font-family: monospace; font-size: 12px; }
  .muted { color: var(--text-dim); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: #1e2536;
    color: var(--text);
    cursor: pointer;
  }
  .actions button:hover { border-color: var(--accent); }
  .actions button.resolve:hover { border-color: var(--green); color: var(--green); }
  .actions button.dismiss:hover { border-color: var(--gray); color: var(--gray); }
  .actions button.followup:hover { border-color: var(--accent); color: var(--accent); }
  .actions button.receive:hover { border-color: var(--accent); color: var(--accent); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .error { background: var(--red-bg); color: var(--red); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
  .loading { color: var(--text-dim); padding: 20px; }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center; justify-content: center;
    z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    width: 360px;
  }
  .modal h3 { margin: 0 0 12px 0; font-size: 15px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px 0; }
  .modal select {
    width: 100%;
    background: #0f1420;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
  }
  .modal textarea {
    width: 100%;
    min-height: 80px;
    background: #0f1420;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
  }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-buttons button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #1e2536;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .modal-buttons button.primary { background: var(--accent); border-color: var(--accent); color: white; }
</style>
</head>
<body>

<h1>Control de Devoluciones — Comfort Sleep</h1>
<div class="subtitle">Todas las devoluciones FBA y FBM. Las sospechosas quedan resaltadas en color; el resto aparece sin incidencia. Actualizado en directo desde Supabase.</div>

<div id="error" class="error" style="display:none;"></div>

<div class="kpis">
  <div class="kpi risk">
    <div class="label">Dinero en riesgo</div>
    <div class="value" id="kpi-risk">—</div>
  </div>
  <div class="kpi">
    <div class="label">Casos con incidencia</div>
    <div class="value" id="kpi-count">—</div>
  </div>
  <div class="kpi">
    <div class="label">Urgentes (rojo)</div>
    <div class="value" id="kpi-red">—</div>
  </div>
  <div class="kpi">
    <div class="label">Total devoluciones</div>
    <div class="value" id="kpi-total">—</div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search" class="search-box" placeholder="Buscar por nº de pedido...">
  <select id="gestor-filter">
    <option value="all">Todos los gestores</option>
    <option value="__unassigned">Sin asignar</option>
    <option value="Iván">Iván</option>
    <option value="Petro">Petro</option>
    <option value="Luis">Luis</option>
  </select>
  <select id="gestion-filter">
    <option value="active" selected>Activos (Pendiente + Seguimiento)</option>
    <option value="pending">Solo Pendiente</option>
    <option value="claim_filed">Solo Seguimiento</option>
    <option value="resolved">Solo Finalizado</option>
    <option value="dismissed">Solo Descartado</option>
    <option value="all">Todos (incluye Finalizado/Descartado)</option>
  </select>
  <select id="date-filter">
    <option value="all" selected>Todas las fechas (solicitud)</option>
    <option value="today">Último día</option>
    <option value="week">Última semana</option>
    <option value="month">Último mes</option>
    <option value="specific-month">Un mes concreto…</option>
    <option value="specific-year">Un año concreto…</option>
  </select>
  <select id="date-month-picker" style="display:none;">
    <option value="0">Enero</option>
    <option value="1">Febrero</option>
    <option value="2">Marzo</option>
    <option value="3">Abril</option>
    <option value="4">Mayo</option>
    <option value="5">Junio</option>
    <option value="6">Julio</option>
    <option value="7">Agosto</option>
    <option value="8">Septiembre</option>
    <option value="9">Octubre</option>
    <option value="10">Noviembre</option>
    <option value="11">Diciembre</option>
  </select>
  <select id="date-year-picker" style="display:none;"></select>
  <button id="export-btn" class="export-btn">⬇ Descargar Excel</button>
</div>

<div class="filter-groups">
  <div class="filters" id="filters">
    <button data-filter="all" class="active">Todos</button>
    <button data-filter="red">🔴 Urgente</button>
    <button data-filter="orange">🟠 Últimos días</button>
    <button data-filter="yellow">🟡 Vigilar</button>
    <button data-filter="gray">⚪ Revisar</button>
    <button data-filter="none">🟢 Sin incidencia</button>
  </div>
  <div class="filters" id="channel-filters">
    <button data-channel="all" class="active">Todos los canales</button>
    <button data-channel="fba">Solo FBA</button>
    <button data-channel="fbm">Solo FBM</button>
  </div>
</div>

<div class="result-count" id="result-count"></div>

<div id="content"><div class="loading">Cargando…</div></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title">Marcar caso</h3>
    <label for="modal-handler">¿Quién lo gestiona?</label>
    <select id="modal-handler">
      <option value="">Selecciona...</option>
      <option value="Iván">Iván</option>
      <option value="Petro">Petro</option>
      <option value="Luis">Luis</option>
    </select>
    <div id="modal-outcome-wrap" style="display:none;">
      <label for="modal-outcome">¿Ganada o perdida?</label>
      <select id="modal-outcome">
        <option value="">Selecciona...</option>
        <option value="ganada">🟢 Ganada (recuperado)</option>
        <option value="perdida">🔴 Perdida (no recuperado)</option>
      </select>
    </div>
    <label for="modal-notes">Nota (opcional)</label>
    <textarea id="modal-notes" placeholder="Qué hiciste, qué encontraste..."></textarea>
    <div class="modal-buttons">
      <button id="modal-cancel">Cancelar</button>
      <button id="modal-confirm" class="primary">Confirmar</button>
    </div>
  </div>
</div>

<script>
  // ==========================================================
  // CONFIGURA ESTO: copia estos dos valores del HTML del
  // dashboard de Mima que ya tienes desplegado.
  // ==========================================================
  const SUPABASE_URL = "https://bhqutqkqvtqebndxrhob.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_TMqI8fBw-M43NDOUaQAIkA_thIn6qRK";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let rows = [];
  let activeFilter = "all";
  let channelFilter = "all";
  let gestorFilter = "all";
  let gestionFilter = "active";
  let dateFilter = "all";
  let dateMonth = 0;
  let dateYear = new Date().getFullYear();
  let searchTerm = "";
  let sortKey = "severity";   // severity | order_date | request_date | days_elapsed | amount_at_risk
  let sortDir = "desc";
  let pendingAction = null;

  const SEVERITY_RANK = { red: 0, orange: 1, yellow: 2, gray: 3, none: 4 };

  const fmtEUR = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n || 0);
  const fmtDate = (d) => {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return '—';
    return dt.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  };

  async function load() {
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';
    const { data, error } = await sb.from('v_returns_full_status').select('*');
    if (error) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Error cargando datos: ' + error.message + ' (revisa que ejecutaste el SQL actualizado y que el anon key es correcto)';
      document.getElementById('content').innerHTML = '';
      return;
    }
    rows = data || [];
    populateYearPicker();
    renderKpis();
    render();
  }

  function populateYearPicker() {
    const years = new Set();
    rows.forEach(r => {
      if (r.request_date) {
        const d = new Date(r.request_date);
        if (!isNaN(d.getTime())) years.add(d.getFullYear());
      }
    });
    const currentYear = new Date().getFullYear();
    years.add(currentYear);
    const sortedYears = [...years].sort((a, b) => b - a);
    const picker = document.getElementById('date-year-picker');
    const prevValue = picker.value;
    picker.innerHTML = sortedYears.map(y => `<option value="${y}">${y}</option>`).join('');
    picker.value = sortedYears.includes(Number(prevValue)) ? prevValue : String(currentYear);
    dateYear = Number(picker.value);
  }

  function renderKpis() {
    const risk = rows.filter(r => r.alert_level === 'red' || r.alert_level === 'orange')
                      .reduce((sum, r) => sum + (Number(r.amount_at_risk) || 0), 0);
    const withIssue = rows.filter(r => r.alert_level !== 'none');
    document.getElementById('kpi-risk').textContent = fmtEUR(risk);
    document.getElementById('kpi-count').textContent = withIssue.length;
    document.getElementById('kpi-red').textContent = rows.filter(r => r.alert_level === 'red').length;
    document.getElementById('kpi-total').textContent = rows.length;
  }

  function applyFilterAndSearch() {
    let filtered = rows;

    // Estado de alerta (color)
    if (activeFilter !== 'all') {
      filtered = filtered.filter(r => r.alert_level === activeFilter);
    }

    // Canal (FBA/FBM) — combinable con el de arriba
    if (channelFilter === 'fba') {
      filtered = filtered.filter(r => r.return_type === 'fba' || r.return_type === 'fba_sin_devolucion');
    } else if (channelFilter === 'fbm') {
      filtered = filtered.filter(r => r.return_type === 'fbm');
    }

    // Gestión (Pendiente/Seguimiento/Finalizado/Descartado)
    if (gestionFilter === 'active') {
      filtered = filtered.filter(r => r.case_status === 'pending' || r.case_status === 'claim_filed');
    } else if (gestionFilter !== 'all') {
      filtered = filtered.filter(r => r.case_status === gestionFilter);
    }

    // Gestor
    if (gestorFilter === '__unassigned') {
      filtered = filtered.filter(r => !r.handled_by);
    } else if (gestorFilter !== 'all') {
      filtered = filtered.filter(r => r.handled_by === gestorFilter);
    }

    // Fecha de solicitud
    if (dateFilter !== 'all') {
      const now = new Date();
      filtered = filtered.filter(r => {
        if (!r.request_date) return false;
        const d = new Date(r.request_date);
        if (isNaN(d.getTime())) return false;
        const diffDays = (now - d) / (1000 * 60 * 60 * 24);
        if (dateFilter === 'today') return diffDays <= 1;
        if (dateFilter === 'week') return diffDays <= 7;
        if (dateFilter === 'month') return diffDays <= 30;
        if (dateFilter === 'specific-month') return d.getMonth() === dateMonth && d.getFullYear() === dateYear;
        if (dateFilter === 'specific-year') return d.getFullYear() === dateYear;
        return true;
      });
    }

    if (searchTerm.trim()) {
      const term = searchTerm.trim().toLowerCase();
      filtered = filtered.filter(r => (r.order_id || '').toLowerCase().includes(term));
    }
    return filtered;
  }

  const FBA_DISPOSITION_LABELS = {
    SELLABLE: 'Vendible',
    CUSTOMER_DAMAGED: 'Dañado por el cliente',
    DEFECTIVE: 'Defectuoso'
  };
  const FBA_STATUS_LABELS = {
    'Unit returned to inventory': 'Devuelto al inventario',
    'IMMEDIATE_DONATION': 'Donado por Amazon'
  };
  function fbaWarehouseStatus(r) {
    if (r.return_type !== 'fba') return '—';
    const disp = r.detailed_disposition ? (FBA_DISPOSITION_LABELS[r.detailed_disposition] || r.detailed_disposition) : null;
    const st = r.return_request_status ? (FBA_STATUS_LABELS[r.return_request_status] || r.return_request_status) : null;
    if (disp && st) return `${disp} — ${st}`;
    return disp || st || '—';
  }

  function sortRows(list) {
    const dir = sortDir === 'asc' ? 1 : -1;
    return [...list].sort((a, b) => {
      if (sortKey === 'severity') {
        const sa = SEVERITY_RANK[a.alert_level] ?? 9;
        const sb_ = SEVERITY_RANK[b.alert_level] ?? 9;
        if (sa !== sb_) return (sa - sb_) * (sortDir === 'asc' ? -1 : 1); // rojo siempre primero salvo que inviertas
        return (Number(b.amount_at_risk) || 0) - (Number(a.amount_at_risk) || 0);
      }
      if (sortKey === 'order_date' || sortKey === 'request_date' || sortKey === 'return_delivery_date') {
        const da = a[sortKey] ? new Date(a[sortKey]).getTime() : 0;
        const db = b[sortKey] ? new Date(b[sortKey]).getTime() : 0;
        return (da - db) * dir;
      }
      if (sortKey === 'days_elapsed') {
        return ((a.days_elapsed ?? -1) - (b.days_elapsed ?? -1)) * dir;
      }
      if (sortKey === 'amount_at_risk') {
        return ((Number(a.amount_at_risk) || 0) - (Number(b.amount_at_risk) || 0)) * dir;
      }
      return 0;
    });
  }

  function setSort(key) {
    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = key === 'severity' ? 'desc' : 'desc';
    }
    render();
  }

  function arrowFor(key) {
    if (sortKey !== key) return '';
    return sortDir === 'asc' ? '▲' : '▼';
  }

  function render() {
    const content = document.getElementById('content');
    const filtered = sortRows(applyFilterAndSearch());

    document.getElementById('result-count').textContent =
      filtered.length + ' de ' + rows.length + ' devoluciones';

    if (filtered.length === 0) {
      content.innerHTML = '<div class="empty">Sin resultados con este filtro/búsqueda.</div>';
      return;
    }

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr>
          <th class="sortable" data-sort="severity">Estado <span class="arrow">${arrowFor('severity')}</span></th>
          <th>Canal</th>
          <th>Pedido / Producto</th>
          <th class="sortable" data-sort="order_date">Fecha pedido <span class="arrow">${arrowFor('order_date')}</span></th>
          <th class="sortable" data-sort="request_date">Fecha solicitud <span class="arrow">${arrowFor('request_date')}</span></th>
          <th class="sortable" data-sort="return_delivery_date">Fecha recepción <span class="arrow">${arrowFor('return_delivery_date')}</span></th>
          <th>Reembolso</th>
          <th>Estado en almacén</th>
          <th class="sortable" data-sort="amount_at_risk">Importe <span class="arrow">${arrowFor('amount_at_risk')}</span></th>
          <th class="sortable" data-sort="days_elapsed">Días <span class="arrow">${arrowFor('days_elapsed')}</span></th>
          <th>Gestión</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');
    filtered.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge ${r.alert_level}">${labelFor(r.alert_level)}</span></td>
        <td>${r.return_type === 'fba_sin_devolucion' ? 'FBA*' : r.return_type.toUpperCase()}</td>
        <td>
          <div class="order-id">${r.order_id}${r.order_return_count > 1 ? ` <span class="muted">(${r.order_return_count} solicitudes para este producto)</span>` : ''}</div>
          <div>${r.product_name || r.sku || ''}</div>
          <div class="reason">${r.alert_level !== 'none' ? (r.alert_reason || '') : ''}</div>
        </td>
        <td>${fmtDate(r.order_date)}</td>
        <td>${fmtDate(r.request_date)}</td>
        <td>
          ${fmtDate(r.return_delivery_date)}
          ${r.received_manual_by ? `<div class="reason">a mano por ${r.received_manual_by}</div>` : ''}
        </td>
        <td><span class="pill ${r.refund_applied ? 'yes' : 'no'}">${r.refund_applied ? 'Sí' : 'No'}</span></td>
        <td>${fbaWarehouseStatus(r)}</td>
        <td class="amount">${r.amount_at_risk != null ? fmtEUR(r.amount_at_risk) : '—'}</td>
        <td>${r.days_elapsed ?? '—'}</td>
        <td>
          <span class="case-tag ${r.case_status}${r.case_status === 'resolved' && r.outcome ? ' ' + r.outcome : ''}">${caseLabel(r.case_status, r.outcome)}</span>
          ${r.handled_by ? `<div class="reason">por ${r.handled_by}</div>` : ''}
          ${r.case_notes ? `<div class="reason">"${r.case_notes}"</div>` : ''}
        </td>
        <td>
          <div class="actions">
            ${r.return_type === 'fbm' ? `<button class="receive" data-order="${r.order_id}" data-type="${r.return_type}" data-sku="${r.sku || ''}" data-action="received">📦 Marcar recibido</button>` : ''}
            <button class="resolve" data-order="${r.order_id}" data-type="${r.return_type}" data-sku="${r.sku || ''}" data-action="case" data-status="resolved">✓ Finalizado</button>
            <button class="followup" data-order="${r.order_id}" data-type="${r.return_type}" data-sku="${r.sku || ''}" data-action="case" data-status="claim_filed">⏳ Seguimiento</button>
            <button class="dismiss" data-order="${r.order_id}" data-type="${r.return_type}" data-sku="${r.sku || ''}" data-action="case" data-status="dismissed">✕ Descartar</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
    content.innerHTML = '';
    content.appendChild(table);

    table.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => setSort(th.dataset.sort));
    });
    tbody.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.order, btn.dataset.type, btn.dataset.sku, btn.dataset.action, btn.dataset.status));
    });
  }

  function labelFor(level) {
    return { red: '🔴 Urgente', orange: '🟠 Últimos días', yellow: '🟡 Vigilar', gray: '⚪ Revisar', none: '🟢 OK' }[level] || level;
  }

  function caseLabel(status, outcome) {
    if (status === 'resolved') {
      if (outcome === 'ganada') return 'Finalizado (Ganada)';
      if (outcome === 'perdida') return 'Finalizado (Perdida)';
      return 'Finalizado';
    }
    return { pending: 'Pendiente', dismissed: 'Descartado', claim_filed: 'Seguimiento' }[status] || status;
  }

  function openModal(order_id, return_type, sku, action, case_status) {
    pendingAction = { order_id, return_type, sku: sku || '', action, case_status };
    const titles = {
      received: 'Marcar como recibido',
      resolved: 'Marcar como finalizado',
      dismissed: 'Descartar caso (no era pérdida)',
      claim_filed: 'Marcar como seguimiento'
    };
    document.getElementById('modal-title').textContent = titles[action === 'received' ? 'received' : case_status];
    document.getElementById('modal-notes').placeholder = action === 'received'
      ? 'Nota (opcional): en qué estado llegó, si falta algo...'
      : 'Qué hiciste, qué encontraste...';
    document.getElementById('modal-notes').value = '';
    document.getElementById('modal-handler').value = '';
    document.getElementById('modal-outcome').value = '';
    document.getElementById('modal-outcome-wrap').style.display = (case_status === 'resolved') ? 'block' : 'none';
    document.getElementById('modal-backdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    pendingAction = null;
  }

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', async () => {
    if (!pendingAction) return;
    const who = document.getElementById('modal-handler').value;
    if (!who) {
      alert('Selecciona quién eres antes de confirmar.');
      return;
    }
    let outcome = null;
    if (pendingAction.action === 'case' && pendingAction.case_status === 'resolved') {
      outcome = document.getElementById('modal-outcome').value;
      if (!outcome) {
        alert('Selecciona si el caso se ha ganado o perdido antes de confirmar.');
        return;
      }
    }
    const notes = document.getElementById('modal-notes').value;

    let payload;
    if (pendingAction.action === 'received') {
      payload = {
        order_id: pendingAction.order_id,
        return_type: pendingAction.return_type,
        sku: pendingAction.sku,
        received_manual_at: new Date().toISOString(),
        received_by: who,
        received_notes: notes || null
      };
    } else {
      payload = {
        order_id: pendingAction.order_id,
        return_type: pendingAction.return_type,
        sku: pendingAction.sku,
        case_status: pendingAction.case_status,
        outcome: outcome,
        notes: notes || null,
        handled_by: who,
        updated_at: new Date().toISOString()
      };
    }

    const { error } = await sb.from('return_case_actions').upsert(payload, { onConflict: 'order_id,return_type,sku' });
    if (error) {
      alert('Error guardando: ' + error.message);
      return;
    }
    closeModal();
    load();
  });

  function exportExcel() {
    const list = sortRows(applyFilterAndSearch());
    const data = list.map(r => ({
      'Estado': labelFor(r.alert_level),
      'Canal': r.return_type === 'fba_sin_devolucion' ? 'FBA*' : r.return_type.toUpperCase(),
      'Pedido': r.order_id,
      'Producto': r.product_name || r.sku || '',
      'Fecha pedido': fmtDate(r.order_date),
      'Fecha solicitud': fmtDate(r.request_date),
      'Fecha recepción': fmtDate(r.return_delivery_date),
      'Reembolso': r.refund_applied ? 'Sí' : 'No',
      'Estado en almacén': fbaWarehouseStatus(r),
      'Importe': r.amount_at_risk != null ? Number(r.amount_at_risk) : '',
      'Días': r.days_elapsed ?? '',
      'Motivo': r.alert_reason || '',
      'Gestión': caseLabel(r.case_status, r.outcome),
      'Resultado': r.case_status === 'resolved' ? (r.outcome === 'ganada' ? 'Ganada' : r.outcome === 'perdida' ? 'Perdida' : '') : '',
      'Gestionado por': r.handled_by || '',
      'Nota': r.case_notes || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Devoluciones');
    XLSX.writeFile(wb, 'devoluciones_comfort_sleep_' + new Date().toISOString().slice(0,10) + '.xlsx');
  }

  document.getElementById('export-btn').addEventListener('click', exportExcel);

  document.getElementById('filters').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.filter;
    render();
  });

  document.getElementById('search').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById('gestor-filter').addEventListener('change', (e) => {
    gestorFilter = e.target.value;
    render();
  });

  document.getElementById('channel-filters').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#channel-filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    channelFilter = e.target.dataset.channel;
    render();
  });

  document.getElementById('gestion-filter').addEventListener('change', (e) => {
    gestionFilter = e.target.value;
    render();
  });

  document.getElementById('date-filter').addEventListener('change', (e) => {
    dateFilter = e.target.value;
    document.getElementById('date-month-picker').style.display = (dateFilter === 'specific-month') ? 'inline-block' : 'none';
    document.getElementById('date-year-picker').style.display = (dateFilter === 'specific-month' || dateFilter === 'specific-year') ? 'inline-block' : 'none';
    render();
  });

  document.getElementById('date-month-picker').addEventListener('change', (e) => {
    dateMonth = Number(e.target.value);
    render();
  });

  document.getElementById('date-year-picker').addEventListener('change', (e) => {
    dateYear = Number(e.target.value);
    render();
  });

  load();
  setInterval(load, 5 * 60 * 1000); // refresca cada 5 min
</script>

</body>
</html>
